[project]
name = "workshop-llm-local"
version = "0.1.0"
description = "Local LLM workshop project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=1.3.5",
    "ipykernel>=7.1.0",
    "mlx-lm>=0.29.1",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []
